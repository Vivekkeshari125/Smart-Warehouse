{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="mb-4">
        <h2>Stock In</h2>

        <p class="text-muted">
            Add incoming stock to warehouse inventory.
        </p>
    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <form method="POST">

                {% csrf_token %}

                <!-- Product -->
                <div class="mb-3">

                    <label class="form-label">
                        Product
                    </label>

                    <select
                        name="product"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Product
                        </option>

                        {% for product in products %}

                        <option value="{{ product.id }}">
                            {{ product.product_name }}
                            - Current Stock: {{ product.quantity }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Quantity -->
                <div class="mb-3">

                    <label class="form-label">
                        Quantity to Add
                    </label>

                    <input
                        type="number"
                        name="quantity"
                        class="form-control"
                        placeholder="Enter quantity"
                        min="1"
                        required
                    >

                </div>

                <!-- Supplier -->
                <div class="mb-3">

                    <label class="form-label">
                        Supplier
                        <span class="text-muted">(Optional)</span>
                    </label>

                    <input
                        type="text"
                        name="supplier"
                        class="form-control"
                        placeholder="Enter supplier name (optional)"
                    >

                </div>

                <!-- Reference -->
                <div class="mb-3">

                    <label class="form-label">
                        Reference Number
                    </label>

                    <input
                        type="text"
                        name="reference"
                        class="form-control"
                        placeholder="Example: GRN-001"
                    >

                </div>

                <!-- Notes -->
                <div class="mb-3">

                    <label class="form-label">
                        Notes
                    </label>

                    <textarea
                        name="notes"
                        class="form-control"
                        rows="3"
                        placeholder="Enter additional notes"
                    ></textarea>

                </div>

                <!-- Buttons -->
                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Add Stock
                </button>

                <a
                    href="/inventory/"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
