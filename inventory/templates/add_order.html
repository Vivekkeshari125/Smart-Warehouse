```html
{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h2 class="fw-bold mb-2">
                        Create New Order
                    </h2>

                    <p class="text-muted mb-4">
                        Create a warehouse order and assign a product.
                    </p>


                    <form method="POST">

                        {% csrf_token %}


                        <!-- Customer -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Customer / Department
                            </label>

                            <input
                                type="text"
                                name="customer"
                                class="form-control"
                                placeholder="Enter customer or department"
                                required>

                        </div>


                        <!-- Product -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Product
                            </label>

                            <select
                                name="product_id"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Product
                                </option>

                                {% for product in products %}

                                    <option value="{{ product.id }}">

                                        {{ product.product_name }}
                                        — Stock: {{ product.quantity }}

                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Quantity -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Quantity
                            </label>

                            <input
                                type="number"
                                name="quantity"
                                class="form-control"
                                placeholder="Enter quantity"
                                min="1"
                                required>

                        </div>


                        <!-- Status -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Order Status
                            </label>

                            <select
                                name="status"
                                class="form-select"
                                required>

                                <option value="Pending">
                                    Pending
                                </option>

                                <option value="Processing">
                                    Processing
                                </option>

                                <option value="Cancelled">
                                    Cancelled
                                </option>

                            </select>

                        </div>


                        <!-- Total -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Total Value
                            </label>

                            <input
                                type="number"
                                name="total"
                                class="form-control"
                                placeholder="Enter total order value"
                                min="0"
                                step="0.01"
                                required>

                        </div>


                        <!-- Buttons -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                Create Order

                            </button>


                            <a
                                href="/orders/"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
```
